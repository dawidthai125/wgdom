  <!DOCTYPE html>
  <html lang="pl">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <meta name="theme-color" content="#344254" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-title" content="W&G DOM" />
      <meta name="format-detection" content="telephone=no" />
      <title>W&amp;G DOM - Zarządzanie Pracą</title>
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <link rel="manifest" href="/manifest.webmanifest" />
      <style>
        html, body { height: 100%; height: 100dvh; margin: 0; overflow: hidden; }
        #root { height: 100%; height: 100dvh; min-height: 0; }
        @media (min-width: 768px) {
          html, body, #root { max-height: 100dvh; }
        }
        button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        /* iOS Safari — zapobiega zoomowaniu przy focus na polach < 16px */
        @media (max-width: 767px) {
          input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
          select,
          textarea { font-size: 16px !important; }
        }
      </style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
