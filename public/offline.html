<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#344254" />
    <title>W&amp;G DOM — brak sieci</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100dvh;
        font-family: Inter, system-ui, sans-serif;
        background: #0f1419;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      }
      .card {
        max-width: 22rem;
        text-align: center;
        background: #1a2332;
        border: 1px solid #2d3a4d;
        border-radius: 1rem;
        padding: 2rem 1.5rem;
      }
      h1 { font-size: 1.125rem; margin: 0 0 0.5rem; }
      p { font-size: 0.875rem; color: #94a3b8; line-height: 1.5; margin: 0 0 1.25rem; }
      button {
        min-height: 44px;
        padding: 0.75rem 1.25rem;
        border: none;
        border-radius: 0.75rem;
        background: #3b82f6;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Brak połączenia</h1>
      <p>Aplikacja W&amp;G DOM potrzebuje internetu, aby załadować panel. Sprawdź Wi‑Fi lub dane komórkowe i spróbuj ponownie.</p>
      <button type="button" onclick="location.reload()">Odśwież</button>
    </div>
  </body>
</html>
