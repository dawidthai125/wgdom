name: Mobile smoke tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "e2e/**"
      - "scripts/mobile-audit.mjs"
      - "playwright.config.ts"
      - "public/**"
      - "src/**"
      - "package.json"

jobs:
  mobile-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run audit:mobile

  mobile-e2e:
    runs-on: ubuntu-latest
    needs: mobile-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:mobile
        env:
          PW_BASE_URL: https://www.wgdom.fun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e-report/
          retention-days: 7
