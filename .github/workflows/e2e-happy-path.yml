# LEGACY (TI-B3) — zastąpiony przez .github/workflows/test-infra-gates.yml (Gate C via orchestrator).
# NIE usuwać. Retire dopiero po pozytywnej weryfikacji nowego workflow (test-infra-gates.yml).
# Ten workflow pomija semantykę bramek release (MB-1/#009) i nie obejmuje E2E-PAYROLL-GUARD-S1.

name: E2E happy path [LEGACY — superseded by test-infra-gates.yml]

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "vercel.json"
      - "scripts/sw.template.js"
      - "scripts/generate-service-worker.mjs"

jobs:
  e2e-happy-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium

      - run: npm run build

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Wait for preview
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "Preview ready"
              exit 0
            fi
            sleep 2
          done
          echo "Preview failed to start"
          exit 1

      - name: E2E-HAPPY-PATH-001
        run: npm run test:e2e:happy
        env:
          PW_BASE_URL: http://127.0.0.1:4173

      - name: E2E Version Awareness 20.5Z.2B
        run: npm run test:e2e:version
        env:
          PW_BASE_URL: http://127.0.0.1:4173

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-stabilization-report
          path: e2e-report/
          retention-days: 7
