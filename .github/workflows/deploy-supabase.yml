# Auto-deploy Edge Function po pushu na main (gdy zmieni się supabase/functions).
# Jednorazowa konfiguracja: GitHub → Settings → Secrets → SUPABASE_ACCESS_TOKEN
# Token: https://supabase.com/dashboard/account/tokens

name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy make-server-0afb8820
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Brak sekretu SUPABASE_ACCESS_TOKEN w GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          supabase functions deploy make-server-0afb8820 --project-ref kchwyjlnkdlymwvsnfiu
