# Auto-deploy Edge Function po pushu na main (gdy zmieni się supabase/functions).
# Jednorazowa konfiguracja: GitHub → Settings → Secrets → SUPABASE_ACCESS_TOKEN
# Token: https://supabase.com/dashboard/account/tokens

name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # Pinned — "latest" trafia w rate limit GitHub API w CI
          version: 2.101.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Ensure kv_store table
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl -sf -X POST "https://api.supabase.com/v1/projects/bdpygdvfgbggermvqtys/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"CREATE TABLE IF NOT EXISTS kv_store_0afb8820 (key TEXT NOT NULL PRIMARY KEY, value JSONB NOT NULL); ALTER TABLE kv_store_0afb8820 ENABLE ROW LEVEL SECURITY;"}'

      - name: Deploy make-server-0afb8820
        env:
          # Sekret (zalecane): Settings → Secrets → Actions → SUPABASE_ACCESS_TOKEN
          # Variables też działa jako fallback, ale Secrets jest bezpieczniejsze
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Brak SUPABASE_ACCESS_TOKEN. GitHub → repo wgdom → Settings → Secrets and variables → Actions → Secrets (NIE Environment) → New repository secret. Nazwa dokładnie: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          echo "Token OK (długość ${#SUPABASE_ACCESS_TOKEN} znaków)"
          supabase functions deploy make-server-0afb8820 --project-ref bdpygdvfgbggermvqtys --use-api
